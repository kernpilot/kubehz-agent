name: CI

# Actions are pinned by COMMIT SHA (README "Security & supply chain": a tag
# can move, a commit cannot). The trailing comment records the tag each SHA
# was resolved from — the same SHAs release.yaml carries (verified against
# the GitHub API 2026-08-21; golangci-lint v2.15.0 verified 2026-11-26).
# Bump the SHA and the comment together, never one alone. Until the first
# vX.Y.Z release is cut, the `main` image this lane builds IS what customers
# and lok8s pin, so this lane holds the release lane's pinning bar.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# One run per ref: a newer push supersedes an in-flight older one, so two
# overlapping main builds can never finish out of order and leave the moving
# `main` image tag pointing at the older commit. Tag (release) runs are never
# cancelled mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.26.11"

jobs:
  test:
    name: lint · vet · test · vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt (must be clean)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Render deploy/base (the manifest lok8s vendors)
        run: |
          kubectl kustomize deploy/base > /tmp/deploy-base.yaml
          grep -q 'node-role.kubernetes.io/control-plane' /tmp/deploy-base.yaml
          grep -q 'name: kubehz-live-agent' /tmp/deploy-base.yaml
          echo "deploy/base renders: $(grep -c '^kind:' /tmp/deploy-base.yaml) objects"
      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned, not `latest`: a linter release can add checks that turn a
          # green tree red with no code change. release.yaml has the same
          # pin: change the two together.
          version: v2.15.0

      - name: go test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  integration:
    name: integration · kind
    # A REAL apiserver, not a fake client. Every unit test in this repository
    # drives a fake dynamic client, so the SCALING loop — the reversible one —
    # also runs against a throwaway kind cluster: real merge patches, real
    # schema validation of spec.replicas, real resourceVersion (which is how
    # "idempotent" gets measured instead of asserted). See test/integration.
    # After the unit lane: a broken tree must not spend a cluster.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The node image is pinned by DIGEST, like every image this repo ships.
      # v1.35.x matches the pilot's Kubernetes and client-go v0.35.6.
      - name: Create a throwaway kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kubehz-agent-it
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0

      - name: Scaling loop against a real apiserver
        run: go test -tags integration -count=1 -v ./test/integration/...

  image:
    name: build · push image
    # Publish only from main: never from PRs (no secrets to forks) and never
    # from TAGS — .github/workflows/release.yaml owns tags. Two workflows
    # building one tag would push two DIFFERENT digests for the same version (a
    # build is not bit-reproducible), leaving `vX.Y.Z` pointing at whichever
    # run finished last. One tag, one builder, one digest.
    if: github.event_name == 'push' && github.ref_type != 'tag'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # public GHCR push
      id-token: write # keyless cosign (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # ── Public, anonymously-pullable canonical image on GHCR (spec §1.5).
      #    Uses the built-in GITHUB_TOKEN (packages:write). This is the artifact
      #    customer clusters pull — Harbor is only an internal mirror, and it is
      #    now taken LAST and best-effort (see the mirror step at the bottom).
      #
      #    It used to log in to Harbor FIRST, before this step. Harbor is private
      #    and IP-allowlisted, so when its credentials went stale the login
      #    failed, the job died before the build, and NO public image could be
      #    produced from main at all — the customer artifact silently froze at
      #    the last build that happened to predate the breakage. A dogfood mirror
      #    must never be able to do that.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/kernpilot/kubehz-agent
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build & push (multi-arch)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true # SLSA build provenance attestation
          sbom: true # attach an SBOM to the image
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

      # ── Supply-chain attestations. Keyless cosign signs the pushed digest via
      #    the Actions OIDC identity (no long-lived key). A standalone SBOM is
      #    also generated + attested. NOTE: these run against the PUBLIC GHCR
      #    image so downstream users can `cosign verify` what runs on their nodes.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "ghcr.io/kernpilot/kubehz-agent@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: "ghcr.io/kernpilot/kubehz-agent@${{ steps.build.outputs.digest }}"
          format: spdx-json
          # artifact-name only names the uploaded workflow artifact; output-file
          # writes the SBOM to the workspace so `cosign attest --predicate` (next
          # step) can actually read it.
          artifact-name: kubehz-agent.spdx.json
          output-file: kubehz-agent.spdx.json

      - name: Attest the SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --type spdxjson \
            --predicate kubehz-agent.spdx.json \
            "ghcr.io/kernpilot/kubehz-agent@${{ steps.build.outputs.digest }}"

      # ── Internal mirror: Harbor (docker.kubehz.in.net) for our own dogfooding
      #    pulls. Copied BY DIGEST — imagetools re-pushes the index that was
      #    already built and signed, so the bytes and the digest are identical
      #    and nothing is rebuilt.
      #
      #    LAST, and best-effort on purpose. Harbor is private and IP-allowlisted;
      #    a stale credential or an unreachable host must cost us a dogfood
      #    convenience, never the public customer image. Guarded in-script rather
      #    than in `if:` because a step's own `env:` is not visible to its own
      #    `if:` expression.
      - name: Mirror to the internal Harbor (best effort)
        continue-on-error: true
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${HARBOR_USERNAME}" ] || [ -z "${HARBOR_PASSWORD}" ]; then
            echo "no Harbor credentials configured — skipping the internal mirror"
            exit 0
          fi
          echo "${HARBOR_PASSWORD}" | docker login docker.kubehz.in.net \
            -u "${HARBOR_USERNAME}" --password-stdin
          docker buildx imagetools create \
            --tag "docker.kubehz.in.net/kubehz-builds/kubehz-agent:${GITHUB_SHA}" \
            --tag "docker.kubehz.in.net/kubehz-builds/kubehz-agent:main" \
            "ghcr.io/kernpilot/kubehz-agent@${DIGEST}"
