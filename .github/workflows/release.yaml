name: Release

# Cuts the PUBLIC, verifiable customer artifact for a `vX.Y.Z` git tag.
#
# ci.yaml stays the CONTINUOUS lane: it builds the moving `main` image and the
# internal Harbor mirror on every push to main. It deliberately no longer runs
# on tags — a tag is this workflow's, and two workflows building the same tag
# would produce two DIFFERENT digests for one version (a build is not
# bit-reproducible), leaving the `vX.Y.Z` registry tag pointing at whichever
# push finished last. One tag, one builder, one digest.
#
# What this lane adds over ci.yaml, per managed-platform-spec §1.5 ("public
# GHCR package, distroless/static base, cosign-signed, SBOM attached, tags
# pinned by digest in the manifests"):
#
#   1. GHCR ONLY on the critical path. The customer image must never depend on
#      the private, IP-allowlisted Harbor being reachable from a GitHub runner.
#      Harbor is mirrored LAST, by digest, and its failure cannot fail a
#      release (see the mirror step).
#   2. A VERIFY gate. Signing that is never verified is a ritual: after signing
#      we run the exact `cosign verify` / `cosign verify-attestation` commands
#      the README hands to customers. If a customer could not verify the image,
#      the release fails here instead of shipping.
#   3. Digest-pinned release artifacts. `install.yaml` / `install-managed.yaml`
#      are rendered from deploy/ with the JUST-BUILT digest substituted, so
#      `kubectl apply -f` off the release page can never resolve a moving tag.
#
# Actions are pinned by COMMIT SHA (AGENTS.md: never guess versions; a tag is
# mutable, a commit is not). The trailing comment records the human-readable
# version each SHA was resolved from — verified against the GitHub API on
# 2026-08-21. Bump the SHA and the comment together, never one alone.
#
# Re-running a release: `workflow_dispatch` with the tag name. Every step is
# idempotent (same source → the release assets are re-uploaded with --clobber),
# so a run that died halfway can be finished without cutting a new version.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to (re-)publish, e.g. v0.1.0"
        required: true
        type: string

# Never cancel a publish mid-flight: a half-signed, half-attested digest is
# worse than a slow queue.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26.7"
  # The canonical, anonymously-pullable customer image (spec §1.5). Harbor is
  # only ever a mirror of what this produces.
  IMAGE: ghcr.io/kernpilot/kubehz-agent

jobs:
  # ── Gate ───────────────────────────────────────────────────────────────────
  # The same bar ci.yaml holds, re-run against the TAGGED tree. A tag can point
  # at a commit whose CI predates a dependency advisory, so govulncheck runs
  # here too — a release is the artifact people actually run.
  verify:
    name: lint · vet · test · vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt (must be clean)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt needed on:"; echo "${unformatted}"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

      - name: go test (race)
        run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # ── Publish ────────────────────────────────────────────────────────────────
  release:
    name: build · sign · attest · verify · publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload assets
      packages: write # push to GHCR
      id-token: write # keyless cosign via the Actions OIDC identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # One place decides what version this run publishes, so no later step has
      # to re-derive it from two possible triggers.
      - name: Resolve the release version
        id: cfg
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_TAG:-${REF_NAME}}"
          # Refuse anything that is not a vX.Y.Z tag: the semver metadata below
          # and the release notes both assume it, and a stray ref would publish
          # a nonsense version people cannot pin.
          case "${version}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a vX.Y.Z release tag: ${version}"; exit 1 ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.cfg.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.cfg.outputs.version }}
            type=sha,format=long
          # Registry tags are for humans and `docker pull`; DEPLOYED manifests
          # always carry the digest (see the render step + deploy/README.md).
          flavor: latest=true

      # Multi-arch is a hard requirement, not a nicety: customer worker nodes
      # are not all x86 (Hetzner CAX/arm64 is the cheapest rung on the ladder).
      # provenance=mode=max attaches the full SLSA build provenance; sbom=true
      # attaches buildkit's own SPDX. Both ride INSIDE the image index.
      - name: Build & push (linux/amd64 + linux/arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.cfg.outputs.version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signing identity is this workflow's OIDC token, so there is
      # no long-lived key to leak and the certificate names the exact workflow
      # file + repo + ref that produced the digest.
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # A standalone, cosign-attested SPDX SBOM on top of buildkit's in-index
      # one: this is the copy customers can fetch and diff without pulling the
      # image, and the one the release page carries.
      - name: Generate the SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: kubehz-agent.spdx.json
          # output-file writes it into the workspace so the attest + release
          # steps below can actually read it (artifact-name only names the
          # uploaded workflow artifact).
          output-file: kubehz-agent.spdx.json

      - name: Attest the SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --type spdxjson \
            --predicate kubehz-agent.spdx.json \
            "${IMAGE}@${DIGEST}"

      # ── The gate that makes "verifiable" more than a word ────────────────
      # These are the EXACT commands README.md / deploy/README.md hand to a
      # customer. If they cannot pass here, against the public image, with no
      # registry credentials in play, then the release is not verifiable and
      # must not ship. The identity regexp is anchored on this repo so a
      # signature from any other workflow is rejected.
      - name: Verify the signature and the SBOM attestation (as a customer would)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/kernpilot/kubehz-agent/\.github/workflows/release\.yaml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity-regexp '^https://github\.com/kernpilot/kubehz-agent/\.github/workflows/release\.yaml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "verified: ${IMAGE}@${DIGEST}"

      # Both architectures must actually be in the published index. A silent
      # single-arch index would only surface as a CrashLoopBackOff on the
      # customer's arm64 node, weeks later.
      - name: Assert the index carries amd64 + arm64
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          platforms=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            | jq -r '.manifests[] | select(.platform.os != "unknown")
                     | "\(.platform.os)/\(.platform.architecture)"' | sort -u)
          echo "${platforms}"
          for want in linux/amd64 linux/arm64; do
            printf '%s\n' "${platforms}" | grep -qx "${want}" \
              || { echo "::error::published index is missing ${want}"; exit 1; }
          done

      # ── Digest-pinned release artifacts ──────────────────────────────────
      # Rendered from the SAME deploy/ tree the repo ships, with the digest we
      # just built and verified substituted in. `kubectl apply -f install.yaml`
      # off the release page therefore pins bytes, never a moving tag — the
      # discipline deploy/README.md states, made true for people who never run
      # kustomize.
      - name: Render the digest-pinned install manifests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null || { echo "::error::kubectl (for kustomize) is not on this runner"; exit 1; }

          # Both entry points (deploy/ and deploy/managed/) render the SAME
          # base, so pinning the base once covers both. This edits the CI
          # checkout only — nothing is committed.
          cat >> deploy/base/kustomization.yaml <<EOF

          # Appended by .github/workflows/release.yaml for ${VERSION}.
          images:
            - name: ${IMAGE}
              digest: ${DIGEST}
          EOF

          kubectl kustomize deploy/ > install.yaml
          kubectl kustomize deploy/managed/ > install-managed.yaml

          # Fail loudly rather than shipping a manifest that resolves a tag.
          for f in install.yaml install-managed.yaml; do
            grep -q "${IMAGE}@${DIGEST}" "${f}" \
              || { echo "::error::${f} is not pinned to ${DIGEST}"; exit 1; }
            ! grep -E "image: .*kubehz-agent:(latest|main|v[0-9])" "${f}" \
              || { echo "::error::${f} still carries a moving tag"; exit 1; }
          done

          printf '%s\n' "${IMAGE}@${DIGEST}" > digest.txt
          sha256sum install.yaml install-managed.yaml kubehz-agent.spdx.json digest.txt > SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          cat > "${notes}" <<EOF
          Public image (multi-arch, linux/amd64 + linux/arm64):

              ${IMAGE}@${DIGEST}

          Verify before you run it — keyless, no key to trust, no account needed:

              cosign verify \\
                --certificate-identity-regexp '^https://github.com/kernpilot/kubehz-agent/.github/workflows/release.yaml@' \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                ${IMAGE}@${DIGEST}

              cosign verify-attestation --type spdxjson \\
                --certificate-identity-regexp '^https://github.com/kernpilot/kubehz-agent/.github/workflows/release.yaml@' \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                ${IMAGE}@${DIGEST}

          Install (the agent reads the existing \`kubehz-agent\` Secret — see deploy/README.md):

              kubectl apply -f install.yaml          # registered tier: observe + report only
              kubectl apply -f install-managed.yaml  # managed tier: + the acting RBAC

          Both manifests pin the digest above. \`SHA256SUMS\` covers every asset;
          \`kubehz-agent.spdx.json\` is the SBOM that is also attested on the image.
          EOF

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" --notes-file "${notes}"
          else
            gh release create "${VERSION}" --title "${VERSION}" --notes-file "${notes}"
          fi
          gh release upload "${VERSION}" \
            install.yaml install-managed.yaml kubehz-agent.spdx.json digest.txt SHA256SUMS \
            --clobber

      # ── Internal mirror (never on the customer's critical path) ──────────
      # Harbor is IP-allowlisted and may simply be unreachable from a GitHub
      # runner. It is copied BY DIGEST (imagetools re-pushes the existing index
      # rather than rebuilding, so the bytes and the digest are identical), it
      # runs AFTER the release is published, and `continue-on-error` means a
      # dogfood-mirror outage can never fail a customer release. Re-run the
      # workflow, or mirror by hand, when Harbor is back.
      - name: Mirror to the internal Harbor (best effort)
        continue-on-error: true
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          # Guarded in the script, not in `if:` — a step's own `env:` is not
          # visible to its own `if:` expression, so the credential check has to
          # happen here.
          if [ -z "${HARBOR_USERNAME}" ] || [ -z "${HARBOR_PASSWORD}" ]; then
            echo "no Harbor credentials configured — skipping the internal mirror"
            exit 0
          fi
          echo "${HARBOR_PASSWORD}" | docker login docker.kubehz.in.net \
            -u "${HARBOR_USERNAME}" --password-stdin
          docker buildx imagetools create \
            --tag "docker.kubehz.in.net/kubehz-builds/kubehz-agent:${VERSION}" \
            "${IMAGE}@${DIGEST}"
