apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubehz-agent BASE = observe + report ONLY (registered tier). Usually not
# applied directly: use `kubectl apply -k deploy/` (registered) or
# `kubectl apply -k deploy/managed/` (managed — adds the acting RBAC for
# server-gated worker scaling). See deploy/README.md.
#
# All resources are named kubehz-live-agent* so this stack COEXISTS with the
# registered-tier bash heartbeat CronJob, which owns the kubehz-agent*
# SA/RBAC/ConfigMap names (different rules — reusing its names would clobber
# them). See deploy/README.md.
#
# Shared, NOT owned here:
#   - Namespace kubehz-system (created if absent; no PSS enforce labels — the
#     namespace is shared with the CronJob agent).
#   - Secret kubehz-agent (ns kubehz-system, keys agent-token/claim-code),
#     bootstrapped by the existing lok8s heartbeat plumbing (create-if-absent,
#     never rotated). The Deployment only mounts it read-only.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - deployment.yaml

# IMAGE OVERRIDE. The default is the PUBLIC GHCR image, pinned by digest
# (base/deployment.yaml) — nothing to configure for a normal customer.
#
# Override here, never by editing deployment.yaml, when you pull from
# somewhere else: our own Harbor dogfood mirror, an air-gapped mirror, or a
# corporate pull-through cache. Keep the DIGEST — that is what makes the ref
# verifiable and rollback-able; only the registry/repository changes.
#
# images:
#   - name: ghcr.io/kernpilot/kubehz-agent
#     newName: docker.kubehz.in.net/kubehz-builds/kubehz-agent
#     digest: sha256:5a34f3569671fb2326b4b7e896069947f5680f9bac242e94fc888dc429720873
#
# To move to a specific release instead, take the digest from that release's
# `digest.txt` (or apply its `install.yaml` directly).
