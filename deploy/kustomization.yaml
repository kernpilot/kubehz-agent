apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# REGISTERED-TIER entry point: observe + report ONLY (the read-only base,
# nothing else). `kubectl apply -k deploy/` keeps working as before the
# base/managed split. For a MANAGED cluster apply deploy/managed/ instead —
# it is the same base plus the opt-in MachineDeployment-patch RBAC (worker
# scaling, P3). See deploy/README.md for the split rationale.
resources:
  - base

# IMAGE OVERRIDE. The default is the PUBLIC GHCR image, pinned by digest
# (base/deployment.yaml) — nothing to configure for a normal customer.
#
# Override here, never by editing deployment.yaml, when you pull from
# somewhere else: our own Harbor dogfood mirror, an air-gapped mirror, or a
# corporate pull-through cache. Keep the DIGEST — that is what makes the ref
# verifiable and rollback-able; only the registry/repository changes.
#
# images:
#   - name: ghcr.io/kernpilot/kubehz-agent
#     newName: docker.kubehz.in.net/kubehz-builds/kubehz-agent
#     digest: sha256:5a34f3569671fb2326b4b7e896069947f5680f9bac242e94fc888dc429720873
#
# To move to a specific release instead, take the digest from that release's
# `digest.txt` (or apply its `install.yaml` directly).
